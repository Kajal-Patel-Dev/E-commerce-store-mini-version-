<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="form-container">

    <h2>Checkout</h2>

    <form  method="POST">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea></textarea>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text">
        </div>

        <button class="btn">
            Place Order
        </button>

    </form>

</div>

</body>
</html>
