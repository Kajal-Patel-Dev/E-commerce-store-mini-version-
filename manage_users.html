<!DOCTYPE html>
<html>
<head>

    <title>Manage Users</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Manage Users</h1>

    <br>

    <table class="cart-table">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>

        </tr>

        {% for user in users %}

        <tr>

            <td>{{ user.id }}</td>

            <td>{{ user.name }}</td>

            <td>{{ user.email }}</td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
