<!DOCTYPE html>
<html>
<head>

    <title>Manage Orders</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Manage Orders</h1>

    <br>

    <table class="cart-table">

        <tr>

            <th>Order ID</th>
            <th>User ID</th>
            <th>Total</th>
            <th>Status</th>

        </tr>

        {% for order in orders %}

        <tr>

            <td>#{{ order.id }}</td>

            <td>{{ order.user_id }}</td>

            <td>₹{{ order.total_amount }}</td>

            <td>{{ order.status }}</td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
