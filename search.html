<!DOCTYPE html>
<html>
<head>

    <title>Search Products</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Search Products</h1>

    <br>

    <form method="GET">

        <div class="form-group">

            <input type="text"
            name="search"
            placeholder="Search products...">

        </div>

        <button class="btn">
            Search
        </button>

    </form>

    <br><br>

    <div class="products">

        {% for product in products %}

        <div class="card">

            <img src="{{ product.image }}">

            <div class="card-body">

                <h3>{{ product.name }}</h3>

                <p>{{ product.description }}</p>

                <div class="price">
                    ₹{{ product.price }}
                </div>

                <a href="/product/{{ product.id }}"
                class="btn">
                    View Product
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
