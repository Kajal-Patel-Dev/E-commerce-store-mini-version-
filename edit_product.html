<!DOCTYPE html>
<html>
<head>

    <title>Edit Product</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <h2>Edit Product</h2>

    <form method="POST">

        <div class="form-group">

            <label>Product Name</label>

            <input type="text"
            name="name"
            value="{{ product.name }}">

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea
            name="description">{{ product.description }}</textarea>

        </div>

        <div class="form-group">

            <label>Price</label>

            <input type="number"
            name="price"
            value="{{ product.price }}">

        </div>

        <div class="form-group">

            <label>Image URL</label>

            <input type="text"
            name="image"
            value="{{ product.image }}">

        </div>

        <button class="btn">
            Update Product
        </button>

    </form>

</div>

</body>
</html>
