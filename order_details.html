<!DOCTYPE html>
<html>
<head>

    <title>Order Details</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Order Details</h1>

    <br>

    <table class="cart-table">

        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
        </tr>

        {% for item in items %}

        <tr>

            <td>{{ item.name }}</td>

            <td>₹{{ item.price }}</td>

            <td>{{ item.quantity }}</td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <div class="total-box">

        Total :
        ₹{{ total }}

    </div>

</div>

</body>
</html>
